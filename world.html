<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Galaxy Explorer — World</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020611;color:#effaff;font-family:Inter,system-ui,Arial;touch-action:none}#stage{position:fixed;inset:0}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}.glass{background:linear-gradient(145deg,#071831dc,#050c20ce);border:1px solid #79eaff66;box-shadow:0 12px 36px #0008,inset 0 1px #fff1;backdrop-filter:blur(13px);border-radius:15px}header{position:absolute;top:13px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:11px;font-weight:1000;letter-spacing:.17em}.brand span{color:#ffd16e}.actions{display:flex;gap:7px;pointer-events:auto}button,a{font:900 10px Arial;letter-spacing:.08em;color:#effcff;text-decoration:none;border:1px solid #83edff88;background:linear-gradient(105deg,#087da7,#3158b4);padding:11px 13px;border-radius:10px;cursor:pointer}.panel{position:absolute;left:18px;top:75px;width:min(310px,78vw);padding:16px;pointer-events:auto}.eyebrow{font-size:9px;letter-spacing:.22em;color:var(--accent);font-weight:950}h1{font-size:clamp(25px,5vw,42px);line-height:.95;margin:10px 0}.copy{font-size:11px;line-height:1.6;color:#b7cce3}.stats{display:flex;gap:8px;margin-top:12px}.stat{flex:1;padding:9px;text-align:center;font-size:8px;color:#9db8d6;letter-spacing:.12em}.stat b{display:block;color:#fff;font-size:19px;margin-top:4px}#message{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 16px;font-size:10px;letter-spacing:.08em;text-align:center;max-width:90vw}#touch{position:absolute;left:12px;bottom:15px;display:none;pointer-events:auto}.pad{display:grid;grid-template-columns:repeat(3,45px);grid-template-rows:repeat(2,42px);gap:4px}.pad button{padding:0;font-size:16px;background:#102c4ce8}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}@media(hover:none) and (pointer:coarse){#touch{display:block}}@media(max-width:600px){header{top:8px;left:8px;right:8px}.brand{font-size:9px}.panel{top:58px;left:8px;padding:12px}.copy{font-size:10px}#message{bottom:100px}}
</style></head><body><div id="stage"></div><div id="ui"><header><div class="brand">GALAXY <span>EXPLORER</span> / EXPEDITION</div><div class="actions"><a href="index.html">← GALAXY HUB</a><button id="full">FULLSCREEN</button></div></header><section class="panel glass"><div class="eyebrow" id="sector">WORLD EXPEDITION</div><h1 id="name">WORLD</h1><div class="copy" id="desc">Explore the world, collect crystals and avoid hazards.</div><div class="stats"><div class="stat glass">CRYSTALS<b id="score">0</b></div><div class="stat glass">BANK<b id="bank">0</b></div></div><div class="copy" style="margin-top:10px">WASD / ARROWS TO MOVE · COLLECT THE GLOWING CRYSTALS</div></section><div id="touch"><div class="pad"><button data-move="forward">▲</button><button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button></div></div><div id="message" class="glass">EXPLORE THE TERRAIN · FIND THE CRYSTALS</div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),id=Math.max(1,Math.min(5,Number(new URLSearchParams(location.search).get('world'))||1));
const worlds=[
{name:'VERDANT PRIME',desc:'A living alien forest. Wander through luminous trees and collect the green life crystals.',color:0x5df59b,ground:0x153c31,sky:0x061b20,accent:0x9dffbd,kind:'forest'},
{name:'EMBERFALL',desc:'A volcanic frontier of black rock, lava rivers and glowing vents. Keep moving and gather fire crystals.',color:0xff704b,ground:0x38201e,sky:0x200b12,accent:0xffb05c,kind:'lava'},
{name:'AZURE DRIFT',desc:'An ocean world of floating islands, deep blue water and drifting crystal formations.',color:0x53baff,ground:0x123b63,sky:0x061b38,accent:0x9deaff,kind:'ocean'},
{name:'NEBULA VEIL',desc:'A strange purple realm of floating monoliths, shimmering dust and hidden violet crystals.',color:0xc17aff,ground:0x2b1748,sky:0x100b2d,accent:0xe1b5ff,kind:'mystery'},
{name:'THE SILENT MOON',desc:'An abandoned lunar outpost. Search the silent ruins for rare moon crystals.',color:0xcbd5e8,ground:0x343b50,sky:0x080d1c,accent:0xe4f2ff,kind:'moon'}
];const w=worlds[id-1];document.documentElement.style.setProperty('--accent','#'+w.color.toString(16).padStart(6,'0'));$('name').textContent=w.name;$('desc').textContent=w.desc;$('sector').textContent='GALAXY 0'+(id+1)+' · FIELD EXPEDITION';
if(!window.THREE){$('message').textContent='3D ENGINE UNAVAILABLE — CHECK YOUR CONNECTION AND RELOAD';return}
let scene,camera,renderer,player,clock=new THREE.Clock(),crystals=[],keys={},touch={},score=0,nearMessage=0;const mat=(c,e=0)=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:e,roughness:.78});
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(w.sky);scene.fog=new THREE.FogExp2(w.sky,.012);camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;$('stage').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(w.accent,0x17102b,2));let sun=new THREE.DirectionalLight(w.accent,2.3);sun.position.set(-20,35,15);scene.add(sun);
let ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240),new THREE.MeshStandardMaterial({color:w.ground,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.7;scene.add(ground);
let starsGeo=new THREE.BufferGeometry(),pts=[];for(let i=0;i<1700;i++)pts.push((Math.random()-.5)*360,Math.random()*130+5,(Math.random()-.5)*360);starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));scene.add(new THREE.Points(starsGeo,new THREE.PointsMaterial({color:w.accent,size:.9})));
for(let i=0;i<42;i++){let x=(Math.random()-.5)*150,z=(Math.random()-.5)*150;if(Math.hypot(x,z)<13)continue;let g=new THREE.Group();g.position.set(x,0,z);if(w.kind==='forest'){let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35,.6,5,7),mat(0x493d32));trunk.position.y=2.5;g.add(trunk);let crown=new THREE.Mesh(new THREE.IcosahedronGeometry(2.8,1),mat(i%2?0x267a55:0x3ba875,.35));crown.position.y=6;g.add(crown);for(let k=0;k<3;k++){let glow=new THREE.Mesh(new THREE.SphereGeometry(.18,8,6),new THREE.MeshBasicMaterial({color:w.accent}));glow.position.set((Math.random()-.5)*3,4+Math.random()*3,(Math.random()-.5)*3);g.add(glow)}}else if(w.kind==='lava'){let rock=new THREE.Mesh(new THREE.DodecahedronGeometry(2+Math.random()*2,1),mat(0x29202a));rock.position.y=1;rock.scale.y=.7;g.add(rock);let fissure=new THREE.Mesh(new THREE.BoxGeometry(.3,.08,2.4),new THREE.MeshBasicMaterial({color:0xff4e24}));fissure.position.y=1.5;g.add(fissure)}else if(w.kind==='ocean'){let island=new THREE.Mesh(new THREE.CylinderGeometry(1,3.5,3,7),mat(0x28708c));island.position.y=2+Math.random()*3;g.add(island);let top=new THREE.Mesh(new THREE.SphereGeometry(2,12,8),mat(0x328f83));top.position.y=4+Math.random()*3;g.add(top)}else{let pillar=new THREE.Mesh(new THREE.BoxGeometry(2+Math.random()*2,5+Math.random()*9,2),mat(w.kind==='moon'?0x65728c:0x654a91,.25));pillar.position.y=2.5+Math.random()*3;pillar.rotation.y=Math.random();g.add(pillar);let ring=new THREE.Mesh(new THREE.TorusGeometry(2,.08,8,32),new THREE.MeshBasicMaterial({color:w.accent}));ring.position.y=4;ring.rotation.x=1.1;g.add(ring)}scene.add(g)}
for(let i=0;i<24;i++){let c=new THREE.Group(),gem=new THREE.Mesh(new THREE.OctahedronGeometry(.9,0),new THREE.MeshStandardMaterial({color:w.color,emissive:w.color,emissiveIntensity:1.8,metalness:.5,roughness:.15}));c.add(gem);let halo=new THREE.Mesh(new THREE.TorusGeometry(1.35,.06,8,24),new THREE.MeshBasicMaterial({color:w.accent}));c.add(halo);c.position.set((Math.random()-.5)*110,1.5,(Math.random()-.5)*110);crystals.push(c);scene.add(c)}
player=new THREE.Group();let suit=new THREE.Mesh(new THREE.CapsuleGeometry(.65,1.1,5,10),mat(0xe9faff,.15));suit.position.y=1.1;player.add(suit);let visor=new THREE.Mesh(new THREE.SphereGeometry(.48,18,14),new THREE.MeshStandardMaterial({color:0x39dfff,emissive:0x087ba9,emissiveIntensity:1.1,metalness:.6}));visor.position.set(0,2,.28);visor.scale.set(1,.78,.65);player.add(visor);scene.add(player);camera.position.set(0,9,17);camera.lookAt(0,1,0);window.addEventListener('resize',resize)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05),f=(keys.w||keys.arrowup||touch.forward?1:0)-(keys.s||keys.arrowdown||touch.back?1:0),r=(keys.d||keys.arrowright||touch.right?1:0)-(keys.a||keys.arrowleft||touch.left?1:0),v=new THREE.Vector3(r,0,-f);if(v.lengthSq()){v.normalize().multiplyScalar(dt*13);player.position.add(v);player.position.x=THREE.MathUtils.clamp(player.position.x,-85,85);player.position.z=THREE.MathUtils.clamp(player.position.z,-85,85);player.rotation.y=Math.atan2(v.x,-v.z)}camera.position.x=THREE.MathUtils.damp(camera.position.x,player.position.x,dt*3);camera.position.z=THREE.MathUtils.damp(camera.position.z,player.position.z+17,dt*3);camera.lookAt(player.position.x,1,player.position.z-5);for(let c of [...crystals]){c.rotation.y+=dt*1.2;c.position.y=1.5+Math.sin(performance.now()*.002+c.position.x)*.3;if(c.position.distanceTo(player.position)<2.2){score+=100;let bank=Number(localStorage.getItem('gxCrystalBank')||0)+1;localStorage.setItem('gxCrystalBank',bank);$('score').textContent=score;$('bank').textContent=bank;scene.remove(c);crystals=crystals.filter(x=>x!==c);$('message').textContent='CRYSTAL COLLECTED · +100';nearMessage=1.2}}if(nearMessage>0){nearMessage-=dt;if(nearMessage<=0)$('message').textContent='EXPLORE THE TERRAIN · FIND THE CRYSTALS'}renderer.render(scene,camera)}
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='f')document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-move]').forEach(b=>{let k=b.dataset.move;b.addEventListener('pointerdown',e=>{e.preventDefault();touch[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>touch[k]=false))});$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();$('bank').textContent=localStorage.getItem('gxCrystalBank')||'0';try{init();loop()}catch(e){console.error(e);$('message').textContent='THE 3D WORLD COULD NOT START — RELOAD TO TRY AGAIN'}}
})();</script></body></html>
